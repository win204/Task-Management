name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 21 environment
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # 3. Cache Maven dependencies

      # 4 & 5 & 6. Run clean verify, unit tests, and build JAR
      # Note: 'verify' natively runs tests and packages the application JAR
      - name: Build and Test with Maven
        run: ./mvnw clean verify

      # 7. Log in to Docker Hub (Required before pushing)
      # We only execute the login and push steps if the trigger was a direct 'push' to main 
      # (so we don't accidentally push images on Pull Requests)
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 8. Build Docker image and push to Docker Hub
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Replace 'taskmanagement' below with your desired Docker Hub repository name if needed
          tags: ${{ secrets.DOCKER_USERNAME }}/taskmanagement:latest
