services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskmanagement-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      SA_PASSWORD: "Password@123"
    ports:
      - "14333:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskmanagement:latest
    container_name: taskmanagement-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://db:1433;databaseName=task_management;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "Password@123"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      SERVER_PORT: "8080"
      JWT_SECRET: "TaskManagementSecretKey2026SpringBootJavaProject"
      FILE_UPLOAD_DIR: "/app/uploads"
    depends_on:
      - db
    volumes:
      - app-uploads:/app/uploads
      - app-logs:/app/logs
    restart: always

volumes:
  mssql-data:
  app-uploads:
  app-logs:
