services:
  # ─── Database: SQL Server 2022 ──────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskmanagement-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      SA_PASSWORD: "Password@123"
    ports:
      - "14333:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password@123' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ─── DB Init: Create the database schema after SQL Server is healthy ────────
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskmanagement-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      SA_PASSWORD: "Password@123"
    volumes:
      - ./sql/init.sql:/init.sql:ro
    command: >
      bash -c "/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P 'Password@123' -C -i /init.sql && echo 'Init complete'"
    restart: "no"

  # ─── Backend: Spring Boot 3.5 ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskmanagement:latest
    container_name: taskmanagement-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://db:1433;databaseName=task_management;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "Password@123"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
      SERVER_PORT: "8080"
      JWT_SECRET: "TaskManagementSecretKey2026SpringBootJavaProject"
      FILE_UPLOAD_DIR: "/app/uploads"
      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: "120000"
      APP_RESET_URL: "http://localhost:5173"
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - app-uploads:/app/uploads
      - app-logs:/app/logs
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Frontend: React 19 + Vite → Nginx ─────────────────────────────────────
  frontend:
    build:
      context: ./taskmanagement-ui
      dockerfile: Dockerfile
    image: taskmanagement-ui:latest
    container_name: taskmanagement-frontend
    ports:
      - "5173:80"
    environment:
      # In Docker Compose, nginx proxies /api/* to the 'app' service on port 8080
      BACKEND_HOST: "app:8080"
    depends_on:
      app:
        condition: service_healthy
    restart: always

volumes:
  mssql-data:
  app-uploads:
  app-logs:
