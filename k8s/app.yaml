apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapp
  namespace: taskmanagement
  labels:
    app.kubernetes.io/name: taskmanagement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskapp
  template:
    metadata:
      labels:
        app: taskapp
    spec:
      initContainers:
        - name: init-db
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskapp-secret
                  key: db-password
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for SQL Server to be ready..."
              until /opt/mssql-tools18/bin/sqlcmd -C -S sql-server -U sa -P "$SA_PASSWORD" -Q "SELECT 1" &> /dev/null; do
                echo "SQL Server is unavailable - sleeping"
                sleep 5
              done
              echo "Creating database task_management if it does not exist..."
              /opt/mssql-tools18/bin/sqlcmd -C -S sql-server -U sa -P "$SA_PASSWORD" -Q "IF NOT EXISTS(SELECT * FROM sys.databases WHERE name='task_management') CREATE DATABASE task_management;"
      containers:
        - name: taskapp
          image: taskmanagement:v4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: taskapp-config
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: taskapp-config
                  key: db-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: taskapp-config
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskapp-secret
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskapp-secret
                  key: jwt-secret
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskapp-secret
                  key: mail-password
            - name: APP_RESET_URL
              valueFrom:
                configMapKeyRef:
                  name: taskapp-config
                  key: app-reset-url
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: taskapp-config
                  key: mail-username
            - name: SPRING_MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: taskapp-config
                  key: mail-host
            - name: SPRING_MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: taskapp-config
                  key: mail-port
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: taskapp-service
  namespace: taskmanagement
  labels:
    app.kubernetes.io/name: taskmanagement
spec:
  type: ClusterIP
  selector:
    app: taskapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
