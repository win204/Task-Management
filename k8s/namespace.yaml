apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapp-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: taskapp-frontend

  template:
    metadata:
      labels:
        app: taskapp-frontend

    spec:
      containers:
        - name: taskapp-frontend
          image: taskmanagement-ui:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: taskapp-frontend-service

spec:
  type: LoadBalancer

  selector:
    app: taskapp-frontend

  ports:
    - port: 80
      targetPort: 80