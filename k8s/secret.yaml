apiVersion: v1
kind: Secret
metadata:
  name: taskapp-secret
  namespace: taskmanagement
  labels:
    app.kubernetes.io/name: taskmanagement
type: Opaque
stringData:
  # ─── Database ────────────────────────────────────────────────────────────────
  # Replace with your SQL Server SA password
  db-password: "Password@123"

  # ─── JWT ─────────────────────────────────────────────────────────────────────
  # Use a strong random secret (min 32 chars), e.g.: openssl rand -hex 32
  jwt-secret: "CHANGE_ME_JWT_SECRET_MIN_32_CHARS"

  # ─── SMTP (Gmail App Password) ───────────────────────────────────────────────
  # Your Gmail address (sender account)
  mail-username: "CHANGE_ME_YOUR_EMAIL@gmail.com"
  # Google App Password (16-char, NOT your Gmail login password)
  # Generate at: https://myaccount.google.com/apppasswords
  mail-password: "CHANGE_ME_GOOGLE_APP_PASSWORD"
