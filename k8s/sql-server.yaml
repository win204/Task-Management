apiVersion: apps/v1
kind: Deployment
metadata:
name: sql-server
spec:
replicas: 1
selector:
matchLabels:
app: sql-server
template:
metadata:
labels:
app: sql-server
spec:
securityContext:
fsGroup: 10001
containers:
- name: sql-server
image: mcr.microsoft.com/mssql/server:2022-latest
securityContext:
runAsUser: 10001
ports:
- containerPort: 1433
env:
- name: ACCEPT_EULA
value: "Y"
- name: MSSQL_PID
value: "Developer"
- name: MSSQL_SA_PASSWORD
valueFrom:
secretKeyRef:
name: taskapp-secret
key: db-password
readinessProbe:
tcpSocket:
port: 1433
initialDelaySeconds: 30
periodSeconds: 10
volumeMounts:
- name: sql-server-data
mountPath: /var/opt/mssql
volumes:
- name: sql-server-data
persistentVolumeClaim:
claimName: sql-server-pvc


apiVersion: v1
kind: Service
metadata:
name: sql-server
spec:
selector:
app: sql-server
ports:
- protocol: TCP
port: 1433
targetPort: 1433
type: ClusterIP
