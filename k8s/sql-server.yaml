apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-server
  namespace: taskmanagement
  labels:
    app.kubernetes.io/name: taskmanagement
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sql-server
  template:
    metadata:
      labels:
        app: sql-server
    spec:
      containers:
        - name: sql-server
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: "Express"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskapp-secret
                  key: db-password
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: sql-server-data
              mountPath: /var/opt/mssql
      volumes:
        - name: sql-server-data
          persistentVolumeClaim:
            claimName: sql-server-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sql-server
  namespace: taskmanagement
  labels:
    app.kubernetes.io/name: taskmanagement
spec:
  selector:
    app: sql-server
  ports:
    - protocol: TCP
      port: 1433
      targetPort: 1433
  type: ClusterIP