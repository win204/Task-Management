server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve React Router correctly — all paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* requests to the Spring Boot backend
    # In Docker Compose: uses 'app' hostname (BACKEND_HOST=app:8080)
    # In Kubernetes:     uses 'taskapp-service' ClusterIP (BACKEND_HOST=taskapp-service:80)
    location /api/ {
        proxy_pass         http://${BACKEND_HOST}/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # Proxy WebSocket connections
    location /ws/ {
        proxy_pass         http://${BACKEND_HOST}/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy Swagger UI
    location /swagger-ui/ {
        proxy_pass         http://${BACKEND_HOST}/swagger-ui/;
        proxy_set_header   Host $host;
    }

    # Proxy OpenAPI spec
    location /v3/ {
        proxy_pass         http://${BACKEND_HOST}/v3/;
        proxy_set_header   Host $host;
    }

    # Proxy Spring Boot Actuator
    location /actuator/ {
        proxy_pass         http://${BACKEND_HOST}/actuator/;
        proxy_set_header   Host $host;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy        "strict-origin-when-cross-origin";
}
